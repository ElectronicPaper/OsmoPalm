; M5Stack Core2 control surface for the Osmo Pocket rig.
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      watch the link
;
; LVGL 8.4 is pinned: 9.x moved the display/indev API and the driver glue below
; would not compile against it.

[env:m5stack-core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5Unified@0.1.17
    m5stack/M5GFX@0.2.28
    lvgl/lvgl@8.4.0
    fastled/FastLED@3.10.3
    h2zero/NimBLE-Arduino@1.4.2

; The standalone transport adds BLE and Wi-Fi to the existing LVGL image.
; Core2 has ample flash, but the default 1.3 MB application partition does
; not. This standard ESP32 layout gives the application 3 MB while retaining
; a filesystem partition and does not change bootloader or hardware settings.
board_build.partitions = huge_app.csv

build_flags =
    ; LVGL finds lv_conf.h on the include path. Do NOT use LV_CONF_PATH here:
    ; the quoting survives neither the ini parser nor the compiler on Windows.
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

; LVGL scans the whole project for its own sources otherwise.
lib_archive = no
